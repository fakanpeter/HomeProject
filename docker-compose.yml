services:
  postgres:
    image: postgres:16
    container_name: task-manager-postgres
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - task_manager_postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"

  postgres-replica:
    image: postgres:16
    container_name: task-manager-postgres-replica
    environment:
      POSTGRES_PASSWORD: password
      PGPASSWORD: replicator_password
    ports:
      - "5434:5432"
    volumes:
      - task_manager_postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      - postgres
    command: >
      bash -c "
        set -e;
      
        until pg_isready -h postgres -p 5432 -U postgres; do
          echo 'Waiting for primary PostgreSQL...';
          sleep 2;
        done;
      
        if [ ! -s \"$$PGDATA/PG_VERSION\" ]; then
          echo 'Initializing replica from primary...';
          rm -rf \"$$PGDATA\"/*;
      
          pg_basebackup -h postgres -p 5432 -D \"$$PGDATA\" -U replicator -Fp -Xs -P;
      
          touch \"$$PGDATA/standby.signal\";
      
          echo \"primary_conninfo = 'host=postgres port=5432 user=replicator password=replicator_password application_name=task-manager-postgres-replica'\" >> \"$$PGDATA/postgresql.auto.conf\";
      
          echo 'Replica initialized.';
        fi;
      
        chown -R postgres:postgres \"$$PGDATA\";
        chmod 700 \"$$PGDATA\";
      
        exec gosu postgres postgres
      "

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: task-manager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8086:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres
      - postgres-replica

  kafka:
    image: apache/kafka:4.1.2
    container_name: task-manager-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: task-manager-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

volumes:
  task_manager_postgres_data:
  task_manager_postgres_replica_data: